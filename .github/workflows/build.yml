name: Azure Container Registry Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  IMAGE_NAME: ${{ vars.AZURE_CONTAINER_IMAGE_NAME || 'librechat' }}
  BUILD_BRANCH: ${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login via Azure CLI
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Azure Container Registry login server
        id: acr
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "$AZURE_CONTAINER_REGISTRY_NAME" --query loginServer -o tsv)"
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_CONTAINER_REGISTRY_NAME"

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          echo "sha_tag=$short_sha" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "latest_tag=dev-latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=${GITHUB_REF_NAME}-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push LibreChat image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.latest_tag }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
