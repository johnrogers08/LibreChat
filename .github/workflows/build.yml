name: Azure Container Registry Build

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'client/**'
      - 'config/**'
      - 'packages/**'
      - 'skill/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-acr-build-main
  cancel-in-progress: true

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  IMAGE_NAME: librechat

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v5

      - name: Login to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve registry login server
        id: acr
        run: echo "login_server=$(az acr show --name \"$AZURE_CONTAINER_REGISTRY_NAME\" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY_NAME"

      - name: Set image reference
        id: image
        run: echo "reference=${{ steps.acr.outputs.login_server }}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push LibreChat image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=azure-librechat
          cache-to: type=gha,mode=max,scope=azure-librechat
          tags: ${{ steps.image.outputs.reference }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ github.run_id }}
