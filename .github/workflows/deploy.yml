name: Azure Container Apps Deploy

on:
  workflow_run:
    workflows:
      - Azure Container Registry Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy from Azure Container Registry
        required: false
        type: string

permissions:
  contents: read

env:
  AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE_NAME: ${{ vars.AZURE_CONTAINER_IMAGE_NAME || 'librechat' }}

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.name == 'Azure Container Registry Build' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Login via Azure CLI
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Azure Container Registry login server
        id: acr
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "$AZURE_CONTAINER_REGISTRY_NAME" --query loginServer -o tsv)"
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: image
        env:
          MANUAL_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || '' }}
        run: |
          set -euo pipefail
          input_tag="$MANUAL_IMAGE_TAG"
          input_tag="$(printf '%s' "$input_tag" | xargs)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$input_tag" ]; then
            tag="$input_tag"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="${{ github.event.workflow_run.head_sha }}"
            tag="${tag::12}"
          else
            tag="dev-latest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify Azure Container App exists
        run: |
          set -euo pipefail
          if ! output="$(
            az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --output none \
              2>&1
          )"; then
            case "$output" in
              *"ResourceNotFound"*|*"could not be found"*)
                echo "Azure Container App $AZURE_CONTAINER_APP_NAME was not found in resource group $AZURE_RESOURCE_GROUP." >&2
                echo "Provision the Container App before running this deployment workflow." >&2
                exit 1
                ;;
              *)
                printf '%s\n' "$output" >&2
                exit 1
                ;;
            esac
          fi

      - name: Configure managed identity for image pulls
        env:
          REGISTRY_SERVER: ${{ steps.acr.outputs.login_server }}
        run: |
          set -euo pipefail
          az containerapp identity assign \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --system-assigned \
            --output none
          principal_file="$(mktemp)"
          acr_file="$(mktemp)"
          az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query identity.principalId \
            -o tsv > "$principal_file" &
          principal_pid=$!
          az acr show \
            --name "$AZURE_CONTAINER_REGISTRY_NAME" \
            --query id \
            -o tsv > "$acr_file" &
          acr_pid=$!
          wait "$principal_pid"
          wait "$acr_pid"
          principal_id="$(cat "$principal_file")"
          acr_id="$(cat "$acr_file")"
          rm -f "$principal_file" "$acr_file"
          assignment_count="$(az role assignment list --assignee-object-id "$principal_id" --scope "$acr_id" --query "[?roleDefinitionName=='AcrPull'] | length(@)" -o tsv)"
          if [ "$assignment_count" = "0" ]; then
            az role assignment create \
              --assignee-object-id "$principal_id" \
              --assignee-principal-type ServicePrincipal \
              --role AcrPull \
              --scope "$acr_id" \
              --output none
          fi
          az containerapp registry set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$REGISTRY_SERVER" \
            --identity system \
            --output none

      - name: Verify image tag exists in Azure Container Registry
        run: |
          set -euo pipefail
          tag_count="$(az acr repository show-tags --name "$AZURE_CONTAINER_REGISTRY_NAME" --repository "$IMAGE_NAME" --query "[?@=='${{ steps.image.outputs.tag }}'] | length(@)" -o tsv)"
          if [ "$tag_count" = "0" ]; then
            echo "Image tag ${{ steps.image.outputs.tag }} was not found for repository $IMAGE_NAME in $AZURE_CONTAINER_REGISTRY_NAME." >&2
            exit 1
          fi

      - name: Deploy latest LibreChat revision
        env:
          IMAGE: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE"
