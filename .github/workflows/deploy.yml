name: Azure Container Apps Deploy

on:
  workflow_run:
    workflows:
      - Azure Container Registry Build
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full immutable Git commit SHA image tag to deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-apps-production
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_RESOURCE_SUFFIX: ${{ vars.AZURE_RESOURCE_SUFFIX }}

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve immutable image tag
        id: image
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          WORKFLOW_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="${MANUAL_IMAGE_TAG:-$WORKFLOW_IMAGE_TAG}"
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || { echo 'Image tag must be a full commit SHA.' >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate infrastructure template
        run: az bicep build --file infra/main.bicep --outfile /tmp/main.json

      - name: Deploy infrastructure and release revision
        id: deployment
        run: |
          set -euo pipefail
          az deployment group create \
            --name "librechat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              resourceSuffix="$AZURE_RESOURCE_SUFFIX" \
              imageTag="${{ steps.image.outputs.tag }}" \
              deployApp=true \
              assignAppRoles=false \
              assignDeploymentRoles=false \
              githubRepository="$GITHUB_REPOSITORY" \
              entraTenantId="${{ vars.ENTRA_TENANT_ID }}" \
              entraClientId="${{ vars.ENTRA_CLIENT_ID }}" \
              entraClientSecret="${{ secrets.ENTRA_CLIENT_SECRET }}" \
              openIdSessionSecret="${{ secrets.OPENID_SESSION_SECRET }}" \
              mongoAdminPassword="${{ secrets.MONGO_ADMIN_PASSWORD }}" \
              credsKey="${{ secrets.CREDS_KEY }}" \
              credsIv="${{ secrets.CREDS_IV }}" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
            --query properties.outputs.containerAppUrl.value -o tsv > app-url.txt
          echo "url=$(cat app-url.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify deployed health endpoint
        env:
          APP_URL: ${{ steps.deployment.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "$APP_URL/health"; then exit 0; fi
            echo "Health check ${attempt}/30 failed; retrying."
            sleep 10
          done
          exit 1
