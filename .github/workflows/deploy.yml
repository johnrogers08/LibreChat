name: Azure Container Apps Deploy

on:
  workflow_run:
    workflows:
      - Azure Container Registry Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy from Azure Container Registry
        required: false
        type: string

permissions:
  contents: read

env:
  AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE_NAME: ${{ vars.AZURE_CONTAINER_IMAGE_NAME || 'librechat' }}

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.name == 'Azure Container Registry Build' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Login via Azure CLI
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Azure Container Registry login server
        id: acr
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "$AZURE_CONTAINER_REGISTRY_NAME" --query loginServer -o tsv)"
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: image
        run: |
          set -euo pipefail
          input_tag="${{ inputs.image_tag }}"
          input_tag="$(printf '%s' "$input_tag" | xargs)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$input_tag" ]; then
            tag="$input_tag"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="${{ github.event.workflow_run.head_sha }}"
            tag="${tag::12}"
          else
            tag="dev-latest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy latest LibreChat revision
        env:
          IMAGE: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE"
